<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELFACYEL AI - الواجهة الرسمية</title>
    <!-- استيراد خط أنيق من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #161b22;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px: solid #30363d;
        }
        h1 {
            color: #58a6ff;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #238636;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 ELFACYEL AI</h1>
        <p>نظام ذكاء اصطناعي متطور ومفتوح المصدر. تم تطوير هذه الواجهة وإطلاقها مباشرة من هاتف Android بكل احترافية!</p>
        <a href="https://github.com/7facyel3-hub/ELFACYEL-Music-Android" class="btn" target="_blank">استعرض المشروع على GitHub</a>
    </div>

    <footer>
